# Overall score /10 = weighted average of included dimensions.
# Dimensions marked NOT_APPLICABLE or INSUFFICIENT_DATA are excluded and the
# remaining weights are renormalized.

weights:
  troubleshooting: 30
  communication: 20
  slo: 20
  idle: 15
  three_strike: 10
  temperature_handling: 5

# How a 1-5 rubric score maps to /10.
#   linear_0_10: 1 -> 0, 3 -> 5, 5 -> 10   ((s - 1) * 2.5)
#   times_two:   1 -> 2, 3 -> 6, 5 -> 10   (s * 2)
normalization: linear_0_10

deterministic:
  slo:            {MET: 10, BREACHED: 0}
  idle:           {NO_SUPPORT_IDLE: 10, SUPPORT_IDLE: 0}
  three_strike:   {APPLIED_CORRECTLY: 10, APPLIED_INCORRECTLY: 0}

# ---------------------------------------------------------------- temperature (one source)
# The temperature rubric returns one reading (1-5) per customer message. From those readings:
#   start = first reading, end = last reading, peak = highest reading (mean across runs),
#   trajectory = end vs start: worsening if end > start, improving if end < start, else stable.
# Two measures read these SAME stored values:
#   * Customer temperature (context only, not scored): label of the end reading.
#   * Temperature handling (the TSE's scored dimension): see below.
customer_temperature:
  labels: {1: Calm, 2: Neutral, 3: Frustrated, 4: Angry, 5: Angry}

temperature_handling:
  # trajectory_map (CURRENT, default): improving 5, stable 3, worsening 1 -> normalized to /10
  #   (linear_0_10: 5 -> 10.0, 3 -> 5.0, 1 -> 0.0).
  # outcome_based (option, off): de-escalated or stable-calm = 5 (10/10); stable but elevated
  #   (end > calm_at_most) = stable_elevated; escalated = escalated.
  mode: trajectory_map
  trajectory_scores:
    improving: 5
    stable: 3
    worsening: 1
  outcome_scores: {de_escalated: 5, stable_calm: 5, stable_elevated: 2, escalated: 1}
  calm_at_most: 2

# When repeated LLM runs differ, the score used is the mean of the runs.

# ---------------------------------------------------------------- audit quality (computed)
quality:
  data_completeness:                # 0-1; routing threshold lives in review.yaml
    missing_key_field: 0.15         # per missing key field (severity, opened_at, owner, item timestamps)
    short_case: 0.15                # fewer than min_communications customer-facing communications
    min_communications: 3
