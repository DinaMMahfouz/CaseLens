# A case is routed to the human review queue when ANY rule matches.
# Each match adds its reason label.

rules:
  LOW_SCORE:
    enabled: true
    overall_below: 4.0
  LOW_CONFIDENCE:
    enabled: true
    levels: [LOW]
  RULE_BREACH:
    enabled: true
    slo_breached: true
    three_strike_incorrect: true
  HOT_CUSTOMER:
    enabled: true
    temperature_at_least: 4
    trajectory_worsening: true
  EVAL_FAILED:
    enabled: true
  REDACTION_FAILED:
    enabled: true
