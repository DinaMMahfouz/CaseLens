# A case is routed to the human review queue when ANY rule matches.
# Each match adds its reason label.

rules:
  LOW_SCORE:
    enabled: true
    overall_below: 4.0
  RULE_BREACH:
    enabled: true
    slo_breached: true
    three_strike_incorrect: true
  HOT_CUSTOMER:
    enabled: true
    peak_at_least: 4              # peak customer temperature (1-5) at or above this
    end_above_start: true         # or the customer ended hotter than they started
  INSUFFICIENT_DATA:
    enabled: true
    excluded_deterministic_dimension: true   # SLO / idle / 3-strike excluded for missing source data
    data_completeness_below: 0.80
  EVALUATOR_DISAGREEMENT:
    enabled: true
    run_score_range_at_least: 2   # on any LLM dimension, 1-5 scale
    modal_share_below: 0.75       # or fewer than 75% of runs give the most common score
  EVAL_FAILED:
    enabled: true
  REDACTION_FAILED:
    enabled: true
